[workspace]
members = [
  "crates/omavless-control-protocol",
  "crates/omavless-domain",
  "crates/omavless-dns-transaction",
  "crates/omavless-dns-resolved",
  "crates/omavless-dns-retention",
  "crates/omavless-dns-broker",
  "crates/omavless-dns-channel",
  "crates/omavless-dns-tun",
  "crates/omavless-mihomo",
  "crates/omavless-parity",
  "crates/omavless-profile",
  "crates/omavless-runtime",
  "crates/omavless-store",
  "crates/omavless-tui",
]
resolver = "3"

[workspace.package]
version = "0.9.0-rc.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/k-kostin/omavless"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
