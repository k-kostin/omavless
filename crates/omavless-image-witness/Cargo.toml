[package]
name = "omavless-image-witness"
description = "Default-off original-child read-only executable witness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
developer-helper = []

[dependencies]
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "process"] }
nix = { version = "=0.30.1", features = ["socket", "fs"] }
sha2 = "0.10"

[lints]
workspace = true

[[bin]]
name = "omavless-image-witness"
path = "src/main.rs"
required-features = ["developer-helper"]
