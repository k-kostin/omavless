[package]
name = "omavless-s1-observer"
description = "Opt-in, read-only GIO App proxy observation helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
gio-observation = ["dep:gio", "dep:nix"]
auth-sender-probe = ["gio-observation", "nix/socket", "nix/uio"]
manager-continuity-probe = ["gio-observation", "nix/socket"]
peer-lifetime-tests = ["dep:nix", "nix/socket"]

[dependencies]
gio = { version = "0.22.10", optional = true }
nix = { version = "0.30", features = ["fs", "poll", "process", "signal", "user"], optional = true }
omavless-runtime = { path = "../omavless-runtime", default-features = false }

[[bin]]
name = "omavless-s1-observer"
path = "src/main.rs"
required-features = ["gio-observation"]

[[bin]]
name = "omavless-s1-observer-check"
path = "src/check.rs"
required-features = ["gio-observation"]

[[bin]]
name = "omavless-s1-auth-sender-probe"
path = "src/auth_sender_check.rs"
required-features = ["auth-sender-probe"]

[[bin]]
name = "omavless-s1-manager-continuity-probe"
path = "src/manager_continuity_check.rs"
required-features = ["manager-continuity-probe"]

[lints]
workspace = true
