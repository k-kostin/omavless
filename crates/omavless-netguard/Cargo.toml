[package]
name = "omavless-netguard"
description = "Fixed-protocol transaction model and opt-in developer K1 NetGuard service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nix = { version = "0.30", features = ["fs", "sched", "socket", "uio", "user"] }
nix-netguard = { package = "nix", version = "=0.31.3", path = "../../vendor/nix-netguard", default-features = false, features = ["ioctl", "socket"], optional = true }
zbus = { version = "=5.19.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Explicit private-fork adoption; not an upstream API release or default runtime.
netguard-service-core = ["dep:nix-netguard", "dep:zbus", "nix/dir"]
netguard-client-candidate = ["nix/poll"]
netguard-client-diagnostics = ["netguard-client-candidate"]

[[bin]]
name = "omavless-netguard"
path = "src/main.rs"
required-features = ["netguard-service-core"]

[dev-dependencies]
zbus = "=5.19.0"
sha2 = "=0.10.9"
rustix = { version = "=1.1.5", features = ["fs"] }

[lints]
workspace = true
