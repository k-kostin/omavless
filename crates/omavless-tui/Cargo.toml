[package]
name = "omavless-tui"
description = "Read-only terminal client presentation for the canonical OmaVLESS runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
developer-conditional-close = []
private-backup = []

[dependencies]
omavless-domain = { path = "../omavless-domain" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
nix = { version = "0.30", features = ["fs"] }
zeroize = "1.8"

[dev-dependencies]
omavless-control-protocol = { path = "../omavless-control-protocol" }

[lints]
workspace = true

[[example]]
name = "private_backup_preview"
required-features = ["private-backup"]

[[example]]
name = "private_restore_preview"
required-features = ["private-backup"]
