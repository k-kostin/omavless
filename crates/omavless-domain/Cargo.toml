[package]
name = "omavless-domain"
description = "Pure store, subscription and routing semantics for OmaVLESS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
idna = "1.1"
omavless-profile = { path = "../omavless-profile" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"

[lints]
workspace = true
