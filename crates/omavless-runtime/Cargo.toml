[package]
name = "omavless-runtime"
description = "Private single-owner runtime and semantic CLI foundation for OmaVLESS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["tui"]
tui = ["dep:omavless-tui"]
developer-subscription-schedule = []
network-resume-fixture = []
system-event-source = ["dep:async-io", "dep:async-trait", "dep:futures-lite", "dep:zbus"]

[dependencies]
base64 = "0.22"
nix = { version = "0.30", features = ["fs", "net", "process", "signal", "socket", "uio", "user"] }
async-io = { version = "=2.6.0", optional = true }
async-trait = { version = "=0.1.92", optional = true }
futures-lite = { version = "=2.6.1", optional = true }
zbus = { version = "=5.19.0", optional = true }
omavless-control-protocol = { path = "../omavless-control-protocol" }
omavless-domain = { path = "../omavless-domain" }
omavless-mihomo = { path = "../omavless-mihomo" }
omavless-profile = { path = "../omavless-profile" }
omavless-store = { path = "../omavless-store" }
omavless-tui = { path = "../omavless-tui", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
ureq = { version = "3.4", default-features = false, features = ["platform-verifier", "rustls"] }
url = "2.5"

[dev-dependencies]
async-io = "=2.6.0"
async-trait = "=0.1.92"
futures-lite = "=2.6.1"
zbus = "=5.19.0"
tempfile = "=3.27.0"

[lints]
workspace = true

[[bin]]
name = "omavless"
path = "src/main.rs"

[[example]]
name = "network_resume_fixture"
path = "examples/network_resume_fixture.rs"
required-features = ["network-resume-fixture"]
