name: Native x86_64 package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-package.yml'
      - 'packaging/release/build-x86_64-ci.sh'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel-20260913.0.592969
    steps:
      - name: Install isolated build dependencies
        run: pacman -Syu --noconfirm --needed git rustup python nodejs libcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build accepted runtime and inspect package as an unprivileged user
        shell: bash
        run: |
          useradd --create-home --shell /bin/bash packagebuilder
          chown -R packagebuilder:packagebuilder "$GITHUB_WORKSPACE"
          runuser -u packagebuilder -- bash packaging/release/build-x86_64-ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omavless-0.8.0-x86_64-candidate
          path: /home/packagebuilder/omavless-artifacts/*
          if-no-files-found: error
          retention-days: 30

