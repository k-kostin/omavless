name: Native packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      # Match pair-frontend.py's fail-closed complete native-input projection:
      # unknown/new paths stay protected, ordinary frontend/docs stay excluded.
      - '**'
      - '!README.md'
      - '!AGENTS.md'
      - '!CONTRIBUTING.md'
      - '!DEVELOPMENT_ROADMAP.md'
      - '!CHANGELOG.md'
      - '!GLOSSARY.md'
      - '!manifest.json'
      - '!preview.png'
      - '!backend.sh'
      - '!install.sh'
      - '!tools/uninstall.sh'
      - '!tools/clean-reinstall-098.sh'
      - '!.github/workflows/native-package.yml'
      - '!.github/workflows/test.yml'
      - '!plugin/**'
      - '!docs/**'
      - '!tests/**'
      - '!skills/**'
      - '!packaging/release/**'
      # Re-include compiled data and both producers' explicit build inputs.
      # Both workflows must run for one common app/DNS producer, not borrowed CI.
      - 'plugin/published-pairs.json'
      - 'tests/dns_broker_host/omavless-dns-broker.service'
      - '.github/workflows/native-package.yml'
      - '.github/workflows/dns-pair-native-arm64.yml'
      - 'packaging/release/build-native-ci.sh'
      - 'packaging/release/version-mode.sh'
      - 'packaging/release/client-features.sh'
      - 'packaging/release/build-candidate.py'
      - 'packaging/release/pair-frontend.py'
      - 'tests/installed_native_package.py'
      - 'tests/human_authorization.py'
      - 'tests/dns_broker_host/package/**'
      - 'tests/core_dns_adapter/**'
      - 'packaging/dns/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel-20260913.0.592969
    steps:
      - name: Install isolated build dependencies
        run: pacman -Syu --noconfirm --needed git rustup python nodejs libcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build accepted runtime and inspect package as an unprivileged user
        shell: bash
        run: |
          useradd --create-home --shell /bin/bash packagebuilder
          chown -R packagebuilder:packagebuilder "$GITHUB_WORKSPACE"
          runuser -u packagebuilder -- bash packaging/release/build-native-ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omavless-x86_64-candidate-${{ github.sha }}
          path: /home/packagebuilder/omavless-artifacts/*
          if-no-files-found: error
          retention-days: 30

  package-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify official Arch Linux ARM build root
        shell: bash
        run: |
          set -euo pipefail
          [[ $(uname -m) == aarch64 ]]
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 240 --output rootfs.tar.gz \
            https://de3.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          # Official 2026-08-05 rootfs. A newer upstream image fails closed.
          echo '42a4eeaa038994ffd31fa173256ef2f0ef511358eeb41b9ea1f8626391b9b319  rootfs.tar.gz' | sha256sum --check -
          docker import rootfs.tar.gz omavless-arm-build:local
      - name: Build and inspect on native ARM64 in isolated Arch Linux ARM
        shell: bash
        run: |
          set -euo pipefail
          docker run --name omavless-arm-build \
            --volume "$GITHUB_WORKSPACE:/source" --workdir /source \
            omavless-arm-build:local /bin/bash -euo pipefail -c '
              pacman-key --init
              pacman-key --populate archlinuxarm
              # The disposable Docker runner cannot apply pacman Landlock.
              # Only its downloader sandbox is disabled; package signatures
              # remain mandatory, and the compiler/packager still run unprivileged.
              pacman -Syu --disable-sandbox --noconfirm --needed base-devel git rustup python nodejs libcap
              useradd --create-home --shell /bin/bash packagebuilder
              chown -R packagebuilder:packagebuilder /source
              runuser -u packagebuilder -- bash packaging/release/build-native-ci.sh
            '
          docker cp omavless-arm-build:/home/packagebuilder/omavless-artifacts "$RUNNER_TEMP/omavless-arm-artifacts"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/omavless-arm-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omavless-aarch64-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/omavless-arm-artifacts/*
          if-no-files-found: error
          retention-days: 30
