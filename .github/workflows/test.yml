name: Test

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run isolated checks
        run: ./tests/run.sh
      - name: Run Rust workspace and parity checks
        run: |
          command -v dbus-daemon >/dev/null || { echo "dbus-daemon is required for isolated DNS conformance tests" >&2; exit 1; }
          ./tests/run-rust.sh
