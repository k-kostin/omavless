name: Test

on:
  push:
    branches: [main, 'dev/098-finalization-integration']
    tags: ['**']
  pull_request:

permissions:
  contents: read

# New PR commits supersede old CI evidence; keep the full latest-head gate,
# without four simultaneous rebuilds of an unchanged Rust feature matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run isolated checks
        run: ./tests/run.sh
      - name: Run Rust workspace and parity checks
        run: |
          command -v dbus-daemon >/dev/null || { echo "dbus-daemon is required for isolated DNS conformance tests" >&2; exit 1; }
          ./tests/run-rust.sh
